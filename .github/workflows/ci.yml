name: CI Java
on:
  push:
    branches: [main, 'pratica/**']
    tags: ['v*-rc*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes, empacotamento e gate JaCoCo de 80%
        run: ./mvnw -B verify
      - name: Validar documentação
        run: node scripts/verify-docs.mjs
      - name: Persistência após reinício do JAR
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/persistencia.mjs
      - name: Carga HTTP em banco descartável
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          export ADMIN_PASSWORD="$(openssl rand -hex 16)"
          export DB_URL='jdbc:h2:mem:carga;DB_CLOSE_DELAY=-1'
          java -jar target/organizacao-recursos-1.0.0-SNAPSHOT.jar > target/app-carga.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/saude >/dev/null; then break; fi
            sleep 1
          done
          node scripts/carga.mjs
      - name: Publicar JaCoCo, testes e carga vinculados ao SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ github.sha }}
          path: |
            target/site/jacoco/
            target/surefire-reports/
            performance-local/resultado.json
            docs/testes/persistencia-local.json
            target/app-carga.log
          if-no-files-found: error
          retention-days: 90
      - name: Resumo das evidências
        if: always()
        run: |
          echo "Commit avaliado: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: evidencias-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
  sonar:
    needs: verificar
    if: vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Análise e espera pelo Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" || { echo 'SONAR_TOKEN não configurado'; exit 1; }
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.qualitygate.wait=true
