spring.application.name=organizacao-recursos
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/recursos;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=America/Sao_Paulo
app.admin.email=${ADMIN_EMAIL:admin@exemplo.test}
app.admin.password=${ADMIN_PASSWORD:}
